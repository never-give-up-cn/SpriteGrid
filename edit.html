<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>像素小人帧编辑器</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#141418;color:#eee;padding:16px;margin:0}
.wrap{max-width:1200px;margin:0 auto}
.top-bar{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.canvas-box{border:1px solid #444;background:#222;display:inline-block}
canvas{image-rendering:pixelated;cursor:crosshair}
.palette{display:flex;gap:8px;align-items:center}
.color-item{width:36px;height:36px;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:1px 1px #000}
.color-item.active{border:2px solid #fff}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button{padding:6px 12px;background:#336;border:0;color:#fff;border-radius:4px;cursor:pointer}
button:hover{background:#448}
button.del{background:#833}
.frames-area{margin-top:20px;border-top:1px solid #333;padding-top:16px}
.frame-list{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;min-height:90px}
.frame-thumb{width:90px;height:80px;border:2px solid #444;cursor:pointer;background:#222}
.frame-thumb.active{border-color:#6af}
.frame-thumb.selected{border-color:#fa0}
.ctrl button.active{background:#448;box-shadow:0 0 0 2px #6af}
textarea{width:100%;height:220px;background:#112;color:#6e9;padding:10px;border:1px solid #346;border-radius:4px;font-family:monospace}
.info{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
    <div class="top-bar">
        <div class="palette" id="paletteBox"></div>
        <div>
            <button id="toolBrush">画笔</button>
            <button id="toolErase">橡皮擦(0号)</button>
        </div>
        <div>
            <span>动画速度:</span>
            <input type="range" id="speedSlider" min="2" max="30" value="10">
            <span id="speedText">10</span> tick/帧
        </div>
        <button id="btnTogglePreview">播放预览</button>
    </div>

    <div class="canvas-box">
        <canvas id="drawCanvas" width="576" height="528"></canvas>
    </div>
    <div class="info">画布尺寸：24列 × 22行（和你原始代码数组匹配，一格=24px）鼠标拖拽绘制</div>

    <div class="ctrl">
        <button id="btnNewFrame">新增空白帧</button>
        <button id="btnCopyFrame">复制当前帧</button>
        <button id="btnDelFrame">删除当前帧</button>
        <button id="btnMultiSelect">多选模式</button>
        <button id="btnDeleteSelected" disabled>删除选中帧</button>
        <button id="btnClearFrame">清空当前帧画布</button>
        <button id="btnUndo">撤销 (Ctrl+Z)</button>
        <button id="btnRedo">反撤销 (Ctrl+Y)</button>
        <button id="btnImport">导入图片/GIF</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button id="btnExport">导出 walkFrames 数组</button>
    </div>

    <div class="frames-area">
        <h4>帧列表（点击切换编辑）</h4>
        <div class="frame-list" id="frameList"></div>
    </div>

    <textarea id="outputCode" readonly placeholder="导出的JS数组会显示在这里，可以直接复制到你的项目"></textarea>
</div>

<script src="lib/gifuct-js.js"></script>
<script>
// ========== 和你项目完全一致的配置 ==========
const COL_COUNT = 24;
const ROW_COUNT = 22;
const CELL_SIZE = 24;
const colorMap = {
    0: null,
    1: "#ffbc88",
    2: "#3488ff",
    3: "#222222",
    4: "#28aa58",
    9: "#ffffff"
};
// 反向映射：颜色 => 编号
const colorToKey = {};
Object.entries(colorMap).forEach(([k, c])=>{
    if(c) colorToKey[c] = Number(k);
});

// 颜色解析：单元格可以是固定编号(数字)，也可以是直接存储的颜色值(#rrggbb)
function colorOf(cell){
    return typeof cell === "string" ? cell : colorMap[cell];
}

// 调色板选项
const paletteList = [
    {key:0, label:"0空", color:"#1a1a1a"},
    {key:1, label:"1肤色", color:"#ffbc88"},
    {key:2, label:"2蓝衣", color:"#3488ff"},
    {key:3, label:"3黑", color:"#222222"},
    {key:4, label:"4绿裤", color:"#28aa58"},
    {key:9, label:"9眼白", color:"#ffffff"},
];

// 全局状态
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
let selectedKey = 1;
let tool = "brush"; // brush / erase
let frames = [];
let activeFrameIndex = 0;
let multiSelectMode = false; // 帧列表多选模式
let selectedFrames = new Set(); // 多选选中的帧索引
let isDrawing = false;
let strokeChanged = false; // 本次笔触是否真的改变了像素
let previewTick = 0;
let previewFrameIdx = 0;
let previewRunning = false;
// 撤销 / 反撤销
const HISTORY_LIMIT = 100;
let history = [];
let historyIndex = -1;
const speedSlider = document.getElementById("speedSlider");
let animSpeed = Number(speedSlider.value);

// 初始化调色板
const paletteBox = document.getElementById("paletteBox");
paletteList.forEach(item=>{
    const div = document.createElement("div");
    div.className = "color-item";
    div.style.background = item.color;
    div.textContent = item.label;
    div.dataset.key = item.key;
    if(item.key === selectedKey) div.classList.add("active");
    div.onclick = ()=>{
        document.querySelectorAll(".color-item").forEach(e=>e.classList.remove("active"));
        div.classList.add("active");
        selectedKey = Number(item.key);
        tool = "brush";
        document.getElementById("toolBrush").classList.add("active");
    };
    paletteBox.appendChild(div);
});

// 自定义取色器：支持任意颜色（导入图片的原色也是这种直接存颜色值的格子）
const customWrap = document.createElement("div");
customWrap.className = "color-item";
customWrap.style.position = "relative";
customWrap.style.overflow = "hidden";
customWrap.style.background = "conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)";
customWrap.title = "自定义颜色";
const colorInput = document.createElement("input");
colorInput.type = "color";
colorInput.value = "#ffbc88";
colorInput.style.cssText = "position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0";
customWrap.appendChild(colorInput);
colorInput.oninput = ()=>{
    selectedKey = colorInput.value;
    tool = "brush";
    document.querySelectorAll(".color-item").forEach(e=>e.classList.remove("active"));
    customWrap.classList.add("active");
};
paletteBox.appendChild(customWrap);

// 创建空白帧数据
function createEmptyFrame(){
    const grid = [];
    for(let y=0;y<ROW_COUNT;y++){
        const row = [];
        for(let x=0;x<COL_COUNT;x++) row.push(0);
        grid.push(row);
    }
    return grid;
}

// ========== 撤销 / 反撤销 ==========
// 记录当前 frames 的完整快照，供撤销使用
function pushHistory(){
    // 丢弃被反撤销操作覆盖掉的历史尾部
    history = history.slice(0, historyIndex + 1);
    history.push(frames.map(f=>f.map(r=>[...r])));
    if(history.length > HISTORY_LIMIT) history.shift();
    historyIndex = history.length - 1;
    updateUndoRedoButtons();
}
// 用历史快照恢复 frames
function restoreFromHistory(){
    frames = history[historyIndex].map(g=>g.map(r=>[...r]));
    if(activeFrameIndex >= frames.length) activeFrameIndex = frames.length - 1;
    selectedFrames.clear();
    renderCanvas();
    refreshFrameList();
    updateUndoRedoButtons();
    updateSelectionUI();
}
function undo(){
    if(historyIndex <= 0) return;
    historyIndex--;
    restoreFromHistory();
}
function redo(){
    if(historyIndex >= history.length - 1) return;
    historyIndex++;
    restoreFromHistory();
}
function updateUndoRedoButtons(){
    const und = document.getElementById("btnUndo");
    const red = document.getElementById("btnRedo");
    if(und) und.disabled = (historyIndex <= 0);
    if(red) red.disabled = (historyIndex >= history.length - 1);
}

// 初始化默认4帧（对应你原来walk0~walk3）
frames.push(createEmptyFrame());
frames.push(createEmptyFrame());
frames.push(createEmptyFrame());
frames.push(createEmptyFrame());
pushHistory();

// 渲染画布（frameIndex 可选：不传则渲染当前编辑帧）
function renderCanvas(frameIndex){
    const grid = frames[frameIndex === undefined ? activeFrameIndex : frameIndex];
    ctx.fillStyle="#222";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // 网格线
    ctx.strokeStyle="#333";
    ctx.lineWidth=1;
    for(let x=0;x<=COL_COUNT;x++) ctx.beginPath(),ctx.moveTo(x*CELL_SIZE,0),ctx.lineTo(x*CELL_SIZE,canvas.height),ctx.stroke();
    for(let y=0;y<=ROW_COUNT;y++) ctx.beginPath(),ctx.moveTo(0,y*CELL_SIZE),ctx.lineTo(canvas.width,y*CELL_SIZE),ctx.stroke();

    // 绘制像素
    for(let y=0;y<ROW_COUNT;y++){
        for(let x=0;x<COL_COUNT;x++){
            const k = grid[y][x];
            if(k===0) continue;
            ctx.fillStyle = colorOf(k);
            ctx.fillRect(x*CELL_SIZE+1,y*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2);
        }
    }
}

// 当前应高亮的帧：预览播放时跟随播放帧，否则跟随编辑帧
function getDisplayIndex(){
    return previewRunning ? previewFrameIdx : activeFrameIndex;
}
// 只更新帧列表的高亮框，不重建缩略图
function updateFrameListHighlight(){
    const box = document.getElementById("frameList");
    for(let i=0;i<box.children.length;i++){
        box.children[i].classList.toggle("active", i===getDisplayIndex());
    }
}

// 更新帧缩略图列表
function refreshFrameList(){
    const box = document.getElementById("frameList");
    box.innerHTML = "";
    frames.forEach((f,idx)=>{
        const c = document.createElement("canvas");
        c.width=COL_COUNT*4;c.height=ROW_COUNT*4;
        c.className="frame-thumb";
        if(idx===getDisplayIndex()) c.classList.add("active");
        if(multiSelectMode && selectedFrames.has(idx)) c.classList.add("selected");
        const cctx = c.getContext("2d");
        cctx.fillStyle="#222";
        cctx.fillRect(0,0,c.width,c.height);
        for(let y=0;y<ROW_COUNT;y++){
            for(let x=0;x<COL_COUNT;x++){
                const k = f[y][x];
                if(k===0) continue;
                cctx.fillStyle = colorOf(k);
                cctx.fillRect(x*4,y*4,4,4);
            }
        }
        c.onclick=()=>{
            if(multiSelectMode){
                if(selectedFrames.has(idx)) selectedFrames.delete(idx);
                else selectedFrames.add(idx);
                refreshFrameList();
                updateSelectionUI();
                return;
            }
            activeFrameIndex = idx;
            renderCanvas();
            refreshFrameList();
        };
        box.appendChild(c);
    });
}

// 鼠标坐标转网格
function getGridPos(e){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const x = Math.floor(mx / CELL_SIZE);
    const y = Math.floor(my / CELL_SIZE);
    if(x<0||x>=COL_COUNT||y<0||y>=ROW_COUNT) return null;
    return {x,y};
}

canvas.onmousedown = e=>{
    if(previewRunning) return; // 播放中禁止绘制
    isDrawing=true;
    strokeChanged=false;
    const p = getGridPos(e);
    if(!p) return;
    const grid = frames[activeFrameIndex];
    const v = tool==="erase" ? 0 : selectedKey;
    if(grid[p.y][p.x] !== v){
        grid[p.y][p.x] = v;
        strokeChanged = true;
        renderCanvas();
        refreshFrameList();
    }
};
canvas.onmousemove = e=>{
    if(!isDrawing) return;
    const p = getGridPos(e);
    if(!p) return;
    const grid = frames[activeFrameIndex];
    const v = tool==="erase" ? 0 : selectedKey;
    if(grid[p.y][p.x] !== v){
        grid[p.y][p.x] = v;
        strokeChanged = true;
        renderCanvas();
        refreshFrameList();
    }
};
// 笔触结束时记录"完成后"的状态，这样撤销一步正好回到上一笔的结果
function commitStroke(){
    isDrawing=false;
    if(strokeChanged){
        strokeChanged=false;
        pushHistory();
    }
}
canvas.onmouseup = commitStroke;
canvas.onmouseleave = commitStroke;

// 按钮事件
document.getElementById("toolBrush").onclick=()=>tool="brush";
document.getElementById("toolErase").onclick=()=>tool="erase";

document.getElementById("btnNewFrame").onclick=()=>{
    frames.push(createEmptyFrame());
    activeFrameIndex = frames.length-1;
    clearSelection();
    renderCanvas();
    refreshFrameList();
    pushHistory();
};
document.getElementById("btnCopyFrame").onclick=()=>{
    const src = frames[activeFrameIndex];
    const copy = src.map(r=>[...r]);
    frames.splice(activeFrameIndex+1,0,copy);
    activeFrameIndex++;
    clearSelection();
    renderCanvas();
    refreshFrameList();
    pushHistory();
};
document.getElementById("btnDelFrame").onclick=()=>{
    if(frames.length<=1) return alert("至少保留1帧");
    frames.splice(activeFrameIndex,1);
    if(activeFrameIndex >= frames.length) activeFrameIndex = frames.length-1;
    clearSelection();
    renderCanvas();
    refreshFrameList();
    pushHistory();
};

// 帧多选模式与批量删除
function updateSelectionUI(){
    const btn = document.getElementById("btnDeleteSelected");
    if(btn){
        btn.disabled = selectedFrames.size === 0;
        btn.textContent = selectedFrames.size > 0 ? `删除选中(${selectedFrames.size})` : "删除选中帧";
    }
}
function clearSelection(){
    selectedFrames.clear();
    updateSelectionUI();
}
document.getElementById("btnMultiSelect").onclick = ()=>{
    multiSelectMode = !multiSelectMode;
    if(!multiSelectMode) clearSelection();
    document.getElementById("btnMultiSelect").classList.toggle("active", multiSelectMode);
    refreshFrameList();
    updateSelectionUI();
};
document.getElementById("btnDeleteSelected").onclick = ()=>{
    if(selectedFrames.size === 0) return;
    if(frames.length - selectedFrames.size < 1) return alert("至少保留1帧");
    pushHistory();
    const idxs = [...selectedFrames].sort((a,b)=>b-a); // 从大到小删除，避免索引错位
    for(const i of idxs) frames.splice(i,1);
    if(activeFrameIndex >= frames.length) activeFrameIndex = frames.length - 1;
    selectedFrames.clear();
    renderCanvas();
    refreshFrameList();
    updateSelectionUI();
};
document.getElementById("btnClearFrame").onclick=()=>{
    frames[activeFrameIndex] = createEmptyFrame();
    renderCanvas();
    refreshFrameList();
    pushHistory();
};

// 导出数组（颜色值字符串需加引号，数字编号原样输出）
document.getElementById("btnExport").onclick=()=>{
    const cellStr = c => typeof c === "string" ? `"${c}"` : c;
    const strArr = frames.map(frame=>{
        const rows = frame.map(r=>`[${r.map(cellStr).join(",")}]`);
        return `const walk${frames.indexOf(frame)} = [\n${rows.join(",\n")}\n];`
    });
    const walkFramesCode = `const walkFrames = [\n${frames.map((_,i)=>`walk${i}`).join(",\n")}\n];`;
    const full = strArr.join("\n\n") + "\n\n" + walkFramesCode;
    document.getElementById("outputCode").value = full;
};

speedSlider.oninput = ()=>{
    animSpeed = Number(speedSlider.value);
    document.getElementById("speedText").textContent = animSpeed;
};

// 动画预览
function previewLoop(){
    if(!previewRunning) return;
    previewTick++;
    if(previewTick >= animSpeed){
        previewTick=0;
        previewFrameIdx = (previewFrameIdx+1) % frames.length;
        updateFrameListHighlight(); // 帧列表高亮跟随播放帧
    }
    renderCanvas(previewFrameIdx);
    requestAnimationFrame(previewLoop);
}
// 播放 / 停止合并为一个切换按钮
const btnTogglePreview = document.getElementById("btnTogglePreview");
function updatePreviewBtnLabel(){
    btnTogglePreview.textContent = previewRunning ? "停止预览" : "播放预览";
}
// 播放时锁定所有编辑操作（仅保留停止预览按钮）
function setPreviewLock(locked){
    ["toolBrush","toolErase","btnNewFrame","btnCopyFrame","btnDelFrame","btnMultiSelect","btnDeleteSelected","btnClearFrame","btnImport","btnExport","fileInput","speedSlider"].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.disabled = locked;
    });
    document.getElementById("btnUndo").disabled = locked || historyIndex <= 0;
    document.getElementById("btnRedo").disabled = locked || historyIndex >= history.length - 1;
    ["frameList","paletteBox","drawCanvas"].forEach(id=>{
        document.getElementById(id).style.pointerEvents = locked ? "none" : "";
    });
}
btnTogglePreview.onclick = ()=>{
    if(previewRunning){
        previewRunning = false;
        renderCanvas();
        setPreviewLock(false);
    } else {
        previewFrameIdx = 0;
        previewTick = 0;
        previewRunning = true;
        previewLoop();
        setPreviewLock(true);
    }
    updatePreviewBtnLabel();
    updateFrameListHighlight();
};

// 撤销 / 反撤销
document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;
document.addEventListener("keydown", e=>{
    if(previewRunning) return; // 播放中禁用快捷键操作
    if(!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if(k === "z"){
        e.preventDefault();
        if(e.shiftKey) redo(); else undo();
    } else if(k === "y"){
        e.preventDefault();
        redo();
    }
});

// ========== 导入图片 / GIF ==========
function loadImageFromFile(file){
    return new Promise((resolve, reject)=>{
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = ()=>{ resolve(img); URL.revokeObjectURL(url); };
        img.onerror = ()=>{ reject(new Error("图片加载失败")); URL.revokeObjectURL(url); };
        img.src = url;
    });
}
function rgbToHex(r, g, b){
    const h = n => n.toString(16).padStart(2, "0");
    return "#" + h(r) + h(g) + h(b);
}
// 把任意 Image/Canvas 缩放到 24x22，逐格取色（透明视为空）
function imageToGrid(img){
    const c = document.createElement("canvas");
    c.width = COL_COUNT; c.height = ROW_COUNT;
    const cctx = c.getContext("2d");
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = "high";
    cctx.drawImage(img, 0, 0, COL_COUNT, ROW_COUNT);
    const data = cctx.getImageData(0, 0, COL_COUNT, ROW_COUNT).data;
    const grid = [];
    for(let y=0;y<ROW_COUNT;y++){
        const row = [];
        for(let x=0;x<COL_COUNT;x++){
            const i = (y*COL_COUNT + x) * 4;
            if(data[i+3] < 128){ row.push(0); continue; }
            row.push(rgbToHex(data[i], data[i+1], data[i+2]));
        }
        grid.push(row);
    }
    return grid;
}
// 静态图片 -> 追加一帧
async function importStaticImage(file){
    const img = await loadImageFromFile(file);
    frames.push(imageToGrid(img));
    activeFrameIndex = frames.length - 1;
    clearSelection();
    renderCanvas();
    refreshFrameList();
    pushHistory();
}
// GIF -> 逐帧合成后追加为多帧
async function importGif(file){
    const buf = await file.arrayBuffer();
    const parsed = GIFuct.parseGIF(buf);
    const gifFrames = GIFuct.decompressFrames(parsed, true);
    if(!gifFrames.length){ alert("该 GIF 没有可用的帧"); return; }
    const w = parsed.lsd.width, h = parsed.lsd.height;
    const g = document.createElement("canvas");
    g.width = w; g.height = h;
    const gctx = g.getContext("2d");
    const grids = [];
    let prevDisposal = 0, prevSnap = null;
    for(const f of gifFrames){
        if(prevDisposal === 2){
            gctx.clearRect(0, 0, w, h);              // 上一帧要求恢复背景
        } else if(prevDisposal === 3 && prevSnap){
            gctx.clearRect(0, 0, w, h);
            gctx.drawImage(prevSnap, 0, 0);          // 上一帧要求恢复原帧
        }
        const id = gctx.createImageData(f.dims.width, f.dims.height);
        id.data.set(f.patch);
        gctx.putImageData(id, f.dims.left, f.dims.top);
        const snap = document.createElement("canvas");
        snap.width = w; snap.height = h;
        snap.getContext("2d").drawImage(g, 0, 0);
        prevSnap = snap;
        grids.push(imageToGrid(snap));
        prevDisposal = f.disposalType;
    }
    for(const grid of grids) frames.push(grid);
    activeFrameIndex = frames.length - grids.length;
    clearSelection();
    renderCanvas();
    refreshFrameList();
    pushHistory();
}
document.getElementById("btnImport").onclick = ()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
        if(file.type === "image/gif" || /\.gif$/i.test(file.name)){
            await importGif(file);
        } else {
            await importStaticImage(file);
        }
    }catch(err){
        alert("导入失败：" + err.message);
    }
    e.target.value = ""; // 允许再次选择同一文件
};

// 启动
renderCanvas();
refreshFrameList();
updateUndoRedoButtons();
updateSelectionUI();
</script>
</body>
</html>
